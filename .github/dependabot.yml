version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  # Actions are the other half of the supply chain: a compromised action runs with the
  # workflow's token. Keep them current, and prefer pinning to a SHA for third-party ones.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, ci]
