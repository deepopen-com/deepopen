name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # transformers probes for TensorFlow at import; when TF is present its abseil runtime can
  # deadlock model construction. Laya is torch-only.
  USE_TF: "0"
  USE_TORCH: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the job under a minute instead of pulling CUDA wheels
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Import check
        run: python -c "import laya; print(laya.__version__); print(sorted(laya.__all__))"

      - name: Routing and language-detection tests
        run: |
          python tests/test_router.py
          python tests/test_criteria.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff
        run: ruff check laya/ --select=E9,F63,F7,F82,F401,F811 --line-length=120
      - name: Byte-compile every module
        run: python -m compileall -q laya/ tests/

  build:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Version must match the tag on a release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(python -c "import re;print(re.search(r'version = \"(.*)\"', open('pyproject.toml').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          test "$pkg" = "$tag" || { echo "pyproject $pkg != tag $tag"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
