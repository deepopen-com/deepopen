[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepopen"
dynamic = ["version"]
description = "Fast, non-autoregressive System 1 decision engine with calibrated probabilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Convai Innovations" }
]
keywords = ["decision-model", "rlcd", "calibration", "system-one", "routing", "guardrails", "moderation", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/deepopen-com/deepopen"
Source = "https://github.com/deepopen-com/deepopen"
Issues = "https://github.com/deepopen-com/deepopen/issues"
Demo = "https://huggingface.co/spaces/convaiinnovations/laya-demo"

[tool.setuptools.dynamic]
version = { attr = "deepopen._version.__version__" }

[tool.setuptools.packages.find]
include = ["deepopen", "deepopen.*"]
